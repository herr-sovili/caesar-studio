

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Caesar-Studio</title>

<style>
    :root {
        --outer: #7450b5;
        --inner: #f3ce75;
        --outer-text: #ffffff;
        --inner-text: #49351b;
        --background: #f6f5f9;
        --panel: #ffffff;
        --text: #292532;
        --border: #dedbe5;
    }

    body.monochrome {
        --outer: #404040;
        --inner: #d6d6d6;
        --outer-text: #ffffff;
        --inner-text: #222222;
        --background: #f2f2f2;
        --border: #cccccc;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 24px 16px;
        background: var(--background);
        color: var(--text);
        font-family: Arial, sans-serif;
    }

    .studio {
        max-width: 1050px;
        margin: auto;
        padding: 24px;
        background: var(--panel);
        border-radius: 24px;
        box-shadow: 0 6px 30px #0000000d;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
    }

    h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 36px);
    }

    .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    button {
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 18px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        touch-action: manipulation;
        transition: background 0.15s;
    }

    button:hover {
        background: var(--background);
    }

    button:active {
        transform: scale(0.97);
    }

    button:focus-visible {
        outline: 3px solid var(--outer);
        outline-offset: 3px;
    }

    .legend {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        margin: 24px 0 8px;
        font-size: 14px;
        font-weight: bold;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .color-box {
        width: 18px;
        height: 18px;
        border-radius: 5px;
    }

    .outer-color {
        background: var(--outer);
    }

    .inner-color {
        background: var(--inner);
    }

    .wheel-container {
        width: 100%;
        max-width: 570px;
        margin: 10px auto;
    }

    #wheel {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    .ring {
        cursor: grab;
        touch-action: none;
    }

    .ring.dragging {
        cursor: grabbing;
    }

    .ring-letter {
        font-family: Arial, sans-serif;
        font-weight: 500;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
    }

    .outer-segment {
        fill: var(--outer);
        stroke: white;
        stroke-width: 1.6;
    }

    .inner-segment {
        fill: var(--inner);
        stroke: white;
        stroke-width: 1.6;
    }

    .outer-letter {
        fill: var(--outer-text);
    }

    .inner-letter {
        fill: var(--inner-text);
    }

    .center-circle {
        fill: var(--panel);
        stroke: var(--border);
        stroke-width: 1.5;
    }

    .center-label {
        font-size: 19px;
        font-weight: 500;
        fill: var(--text);
        text-anchor: middle;
    }

    #keyDisplay {
        font-size: 48px;
        font-weight: bold;
        fill: var(--outer);
        text-anchor: middle;
        dominant-baseline: central;
    }

    .center-display {
        pointer-events: none;
    }

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 16px 0;
    }

    .shift-button {
        min-width: 85px;
        font-size: 18px;
    }

    #resetButton {
        font-size: 18px;
    }

    .hint {
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
        color: #77717f;
        margin: 12px 0 26px;
    }

    .mapping-section {
        border-top: 1px solid var(--border);
        padding-top: 20px;
    }

    h2 {
        font-size: 18px;
        margin: 0 0 14px;
    }

    .table-container {
        overflow-x: auto;
        padding-bottom: 5px;
    }

    table {
        width: 100%;
        min-width: 780px;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 3px;
    }

    td {
        padding: 10px 0;
        text-align: center;
        font-weight: bold;
        font-size: 16px;
        border-radius: 4px;
    }

    #plainRow td {
        background: var(--outer);
        color: var(--outer-text);
    }

    #cipherRow td {
        background: var(--inner);
        color: var(--inner-text);
    }

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }

        .studio {
            padding: 16px;
            border-radius: 16px;
        }

        header {
            justify-content: center;
        }

        .toolbar {
            justify-content: center;
        }

        button {
            padding: 10px 14px;
        }

        .legend {
            gap: 12px;
            font-size: 12px;
        }

        .controls {
            gap: 6px;
        }

        .shift-button {
            min-width: 65px;
            font-size: 16px;
        }

        #resetButton {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<main class="studio">

    <header>
        <h1>Caesar-Studio</h1>

        <div class="toolbar">

            <button id="themeButton">
                ◐ Lila &amp; Gold
            </button>

            <button id="soundButton" aria-pressed="true">
                🔊 Ton an
            </button>

        </div>
    </header>

    <div class="legend">

        <div class="legend-item">
            <span class="color-box outer-color"></span>
            Klartext
        </div>

        <div class="legend-item">
            <span class="color-box inner-color"></span>
            Geheimtext
        </div>

    </div>

    <div class="wheel-container">

        <svg id="wheel"
             viewBox="0 0 440 440"
             xmlns="http://www.w3.org/2000/svg"
             aria-label="Caesar-Scheibe mit zwei drehbaren Buchstabenringen">

            <!-- Äußerer Buchstabenring -->

            <g id="outerRing" class="ring"></g>

            <!-- Innerer Buchstabenring -->

            <g id="innerRing" class="ring"></g>

            <!-- Unbewegliche Mitte -->

            <g class="center-display">

                <circle
                    cx="220"
                    cy="220"
                    r="86"
                    class="center-circle"
                />

                <text
                    x="220"
                    y="207"
                    class="center-label">
                    Schlüssel
                </text>

                <text
                    x="220"
                    y="242"
                    id="keyDisplay">
                    0
                </text>

            </g>

        </svg>

    </div>

    <!-- Steuerung unterhalb der Scheibe -->

    <div class="controls">

        <button id="minusButton"
                class="shift-button"
                aria-label="Schlüssel um eins verringern">
            ↶ −1
        </button>

        <button id="resetButton">
            Zurücksetzen
        </button>

        <button id="plusButton"
                class="shift-button"
                aria-label="Schlüssel um eins erhöhen">
            +1 ↷
        </button>

    </div>

    <p class="hint">
        Drehe beide Ringe mit der Maus oder dem Finger.
    </p>

    <section class="mapping-section">

        <h2>Buchstabenzuordnung</h2>

        <div class="table-container">

            <table aria-label="Zuordnung von Klartext und Geheimtext">

                <tbody>
                    <tr id="plainRow"></tr>
                    <tr id="cipherRow"></tr>
                </tbody>

            </table>

        </div>

    </section>

</main>

<script>

    // ========================================
    // Grundeinstellungen
    // ========================================

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const letterCount = alphabet.length;
    const letterAngle = 360 / letterCount;
    const center = 220;

    const svgNS = "http://www.w3.org/2000/svg";

    const wheel =
        document.getElementById("wheel");

    const outerRing =
        document.getElementById("outerRing");

    const innerRing =
        document.getElementById("innerRing");

    const keyDisplay =
        document.getElementById("keyDisplay");

    const minusButton =
        document.getElementById("minusButton");

    const plusButton =
        document.getElementById("plusButton");

    const plainRow =
        document.getElementById("plainRow");

    const cipherRow =
        document.getElementById("cipherRow");


    // Beide Ringe besitzen eine eigene Position.

    const outerState = {
        steps: 0,
        element: outerRing
    };

    const innerState = {
        steps: 0,
        element: innerRing
    };

    let key = 0;
    let soundEnabled = true;
    let audioContext = null;


    // ========================================
    // Hilfsfunktionen
    // ========================================

    function modulo(number, divisor) {
        return ((number % divisor) + divisor) % divisor;
    }

    function createSVG(tag, attributes = {}) {

        const element =
            document.createElementNS(svgNS, tag);

        for (const [name, value] of Object.entries(attributes)) {
            element.setAttribute(name, value);
        }

        return element;
    }

    function polarPoint(radius, angle) {

        const radians =
            (angle - 90) * Math.PI / 180;

        return {
            x: center + radius * Math.cos(radians),
            y: center + radius * Math.sin(radians)
        };
    }


    // ========================================
    // Buchstabenringe erstellen
    // ========================================

    function createRing(
        group,
        outerRadius,
        innerRadius,
        type,
        fontSize
    ) {

        for (let i = 0; i < letterCount; i++) {

            const angle = i * letterAngle;

            const startAngle =
                angle - letterAngle / 2;

            const endAngle =
                angle + letterAngle / 2;

            const p1 =
                polarPoint(outerRadius, startAngle);

            const p2 =
                polarPoint(outerRadius, endAngle);

            const p3 =
                polarPoint(innerRadius, endAngle);

            const p4 =
                polarPoint(innerRadius, startAngle);

            const pathData = [
                `M ${p1.x} ${p1.y}`,
                `A ${outerRadius} ${outerRadius} 0 0 1 ${p2.x} ${p2.y}`,
                `L ${p3.x} ${p3.y}`,
                `A ${innerRadius} ${innerRadius} 0 0 0 ${p4.x} ${p4.y}`,
                "Z"
            ].join(" ");

            const segment = createSVG("path", {
                d: pathData,
                class: `${type}-segment`
            });

            group.appendChild(segment);

            const textRadius =
                (outerRadius + innerRadius) / 2;

            const textPosition =
                polarPoint(textRadius, angle);

            const letter = createSVG("text", {
                x: textPosition.x,
                y: textPosition.y,
                "font-size": fontSize,
                class: `ring-letter ${type}-letter`,
                transform:
                    `rotate(${angle} ${textPosition.x} ${textPosition.y})`
            });

            letter.textContent = alphabet[i];

            group.appendChild(letter);
        }
    }

    createRing(
        outerRing,
        210,
        151,
        "outer",
        29
    );

    createRing(
        innerRing,
        148,
        86,
        "inner",
        25
    );


    // ========================================
    // Zuordnungstabelle
    // ========================================

    function updateTable() {

        plainRow.innerHTML = "";
        cipherRow.innerHTML = "";

        for (let i = 0; i < letterCount; i++) {

            const plainCell =
                document.createElement("td");

            plainCell.textContent = alphabet[i];

            plainRow.appendChild(plainCell);

            const cipherCell =
                document.createElement("td");

            cipherCell.textContent =
                alphabet[modulo(i + key, letterCount)];

            cipherRow.appendChild(cipherCell);
        }
    }


    // ========================================
    // Mechanischer Klicksound
    // ========================================

    function prepareAudio() {

        if (!soundEnabled) return;

        try {

            if (!audioContext) {

                const AudioContextClass =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (!AudioContextClass) return;

                audioContext =
                    new AudioContextClass();
            }

            if (audioContext.state === "suspended") {
                audioContext.resume().catch(() => {});
            }

        } catch (error) {
            // Die Scheibe funktioniert auch ohne Ton.
        }
    }

    function playClick() {

        if (
            !soundEnabled ||
            !audioContext ||
            audioContext.state !== "running"
        ) return;

        const duration = 0.035;

        const sampleCount = Math.max(
            1,
            Math.floor(audioContext.sampleRate * duration)
        );

        const buffer = audioContext.createBuffer(
            1,
            sampleCount,
            audioContext.sampleRate
        );

        const data = buffer.getChannelData(0);

        for (let i = 0; i < sampleCount; i++) {

            const decay =
                Math.exp(-i / (sampleCount * 0.16));

            data[i] =
                (Math.random() * 2 - 1) * decay;
        }

        const source =
            audioContext.createBufferSource();

        source.buffer = buffer;

        const filter =
            audioContext.createBiquadFilter();

        filter.type = "bandpass";
        filter.frequency.value = 1800;
        filter.Q.value = 0.8;

        const gain =
            audioContext.createGain();

        gain.gain.value = 0.25;

        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioContext.destination);

        source.start();
    }


    // ========================================
    // Schlüssel und Drehposition aktualisieren
    // ========================================

    function updateWheel() {

        outerRing.setAttribute(
            "transform",
            `rotate(${outerState.steps * letterAngle} ${center} ${center})`
        );

        innerRing.setAttribute(
            "transform",
            `rotate(${innerState.steps * letterAngle} ${center} ${center})`
        );

        // Relative Verschiebung der beiden Ringe.

        key = modulo(
            outerState.steps - innerState.steps,
            letterCount
        );

        // Schlüssel in der Mitte: 0 bis 25.

        keyDisplay.textContent = key;

        // Verschiebungswerte unterhalb der Scheibe.

        if (key === 0) {

            minusButton.textContent = "↶ −1";
            plusButton.textContent = "+1 ↷";

        } else {

            minusButton.textContent =
                `↶ −${letterCount - key}`;

            plusButton.textContent =
                `+${key} ↷`;
        }

        updateTable();
    }

    function setRotation(state, newSteps, withSound = true) {

        const changed = state.steps !== newSteps;

        state.steps = newSteps;

        updateWheel();

        if (changed && withSound) {
            playClick();
        }
    }


    // ========================================
    // Maus- und Touchsteuerung
    // ========================================

    function getPointerAngle(event) {

        const point = wheel.createSVGPoint();

        point.x = event.clientX;
        point.y = event.clientY;

        const matrix = wheel.getScreenCTM();

        if (!matrix) return null;

        const localPoint = point.matrixTransform(
            matrix.inverse()
        );

        const dx = localPoint.x - center;
        const dy = localPoint.y - center;

        if (Math.hypot(dx, dy) < 20) {
            return null;
        }

        return Math.atan2(dy, dx) * 180 / Math.PI;
    }

    function enableDragging(state) {

        const ring = state.element;

        let activePointer = null;
        let previousAngle = 0;
        let accumulatedAngle = 0;
        let startingSteps = 0;

        ring.addEventListener("pointerdown", event => {

            if (activePointer !== null) return;

            if (
                event.pointerType === "mouse" &&
                event.button !== 0
            ) return;

            const angle = getPointerAngle(event);

            if (angle === null) return;

            event.preventDefault();

            prepareAudio();

            activePointer = event.pointerId;

            previousAngle = angle;

            accumulatedAngle = 0;

            startingSteps = state.steps;

            ring.classList.add("dragging");

            ring.setPointerCapture(event.pointerId);
        });

        ring.addEventListener("pointermove", event => {

            if (event.pointerId !== activePointer) {
                return;
            }

            const currentAngle =
                getPointerAngle(event);

            if (currentAngle === null) return;

            let difference =
                currentAngle - previousAngle;

            // Verhindert Sprünge am Winkelübergang.

            if (difference > 180) {
                difference -= 360;
            }

            if (difference < -180) {
                difference += 360;
            }

            accumulatedAngle += difference;

            previousAngle = currentAngle;

            const newSteps =
                startingSteps +
                Math.round(
                    accumulatedAngle / letterAngle
                );

            if (newSteps !== state.steps) {
                setRotation(state, newSteps);
            }
        });

        function stopDragging(event) {

            if (event.pointerId !== activePointer) {
                return;
            }

            activePointer = null;

            ring.classList.remove("dragging");

            if (ring.hasPointerCapture(event.pointerId)) {

                ring.releasePointerCapture(
                    event.pointerId
                );
            }
        }

        ring.addEventListener(
            "pointerup",
            stopDragging
        );

        ring.addEventListener(
            "pointercancel",
            stopDragging
        );

        ring.addEventListener(
            "lostpointercapture",
            stopDragging
        );
    }

    // Beide Ringe unabhängig voneinander aktivieren.

    enableDragging(outerState);
    enableDragging(innerState);


    // ========================================
    // Steuerungsbuttons
    // ========================================

    minusButton.addEventListener("click", () => {

        prepareAudio();

        setRotation(
            innerState,
            innerState.steps + 1
        );
    });

    plusButton.addEventListener("click", () => {

        prepareAudio();

        setRotation(
            innerState,
            innerState.steps - 1
        );
    });

    document.getElementById("resetButton")
        .addEventListener("click", () => {

            prepareAudio();

            const changed =
                outerState.steps !== 0 ||
                innerState.steps !== 0;

            outerState.steps = 0;
            innerState.steps = 0;

            updateWheel();

            if (changed) {
                playClick();
            }
        });


    // ========================================
    // Farbwechsel
    // ========================================

    const themeButton =
        document.getElementById("themeButton");

    themeButton.addEventListener("click", () => {

        const monochrome =
            document.body.classList.toggle(
                "monochrome"
            );

        themeButton.textContent = monochrome
            ? "◐ Schwarz-Weiß"
            : "◐ Lila & Gold";
    });


    // ========================================
    // Ton ein- und ausschalten
    // ========================================

    const soundButton =
        document.getElementById("soundButton");

    soundButton.addEventListener("click", () => {

        soundEnabled = !soundEnabled;

        soundButton.textContent = soundEnabled
            ? "🔊 Ton an"
            : "🔇 Ton aus";

        soundButton.setAttribute(
            "aria-pressed",
            String(soundEnabled)
        );

        if (soundEnabled) {

            prepareAudio();

            if (audioContext) {

                audioContext.resume()
                    .then(playClick)
                    .catch(() => {});
            }
        }
    });


    // ========================================
    // Startzustand
    // ========================================

    updateWheel();

</script>

</body>
</html>
