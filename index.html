
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caesar-Studio</title>

<style>
  :root {
    --outer: #7450b5;
    --inner: #f3ce75;
    --outer-text: #ffffff;
    --inner-text: #49351a;
    --background: #f5f3f8;
    --surface: #ffffff;
    --text: #302b38;
    --border: #ded9e5;
  }

  body.monochrome {
    --outer: #404040;
    --inner: #d6d6d6;
    --outer-text: #ffffff;
    --inner-text: #252525;
    --background: #f3f3f3;
    --surface: #ffffff;
    --text: #252525;
    --border: #d4d4d4;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text);
  }

  .studio {
    max-width: 1100px;
    margin: auto;
    background: var(--surface);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 4px 24px #00000009;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 28px;
    margin: 0;
  }

  .settings {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:hover {
    background: var(--background);
  }

  button:active {
    transform: scale(0.97);
  }

  button:focus-visible {
    outline: 3px solid var(--outer);
    outline-offset: 3px;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }

  .legend span {
    padding: 9px 20px;
    border-radius: 7px;
    font-weight: bold;
  }

  .plaintext {
    background: var(--outer);
    color: var(--outer-text);
  }

  .ciphertext {
    background: var(--inner);
    color: var(--inner-text);
  }

  .wheel-container {
    width: 100%;
    max-width: 520px;
    margin: 20px auto;
    user-select: none;
    -webkit-user-select: none;
  }

  #wheel {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  #innerRing {
    cursor: grab;
    touch-action: none;
  }

  #innerRing.dragging {
    cursor: grabbing;
  }

  .outer-fill {
    fill: var(--outer);
  }

  .inner-fill {
    fill: var(--inner);
  }

  .outer-letter {
    fill: var(--outer-text);
  }

  .inner-letter {
    fill: var(--inner-text);
  }

  .letter {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 500;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .separator {
    stroke: var(--surface);
    stroke-width: 2;
    pointer-events: none;
  }

  .center-circle {
    fill: var(--surface);
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .key-label {
    fill: var(--text);
    font-size: 20px;
    text-anchor: middle;
    pointer-events: none;
  }

  .key-number {
    fill: var(--outer);
    font-size: 48px;
    font-weight: bold;
    text-anchor: middle;
    pointer-events: none;
  }

  .controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
  }

  .controls button {
    min-width: 80px;
    font-size: 18px;
  }

  .hint {
    text-align: center;
    font-size: 14px;
    opacity: 0.75;
    margin: 16px 0 28px;
  }

  .alphabet-wrapper {
    overflow-x: auto;
    border-radius: 8px;
  }

  .alphabet-table {
    width: 100%;
    min-width: 780px;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .alphabet-table td {
    text-align: center;
    font-size: 19px;
    padding: 13px 0;
    border: 1px solid var(--surface);
  }

  @media (max-width: 600px) {
    body {
      padding: 10px;
    }

    .studio {
      padding: 16px;
      border-radius: 12px;
    }

    header {
      justify-content: center;
    }

    h1 {
      width: 100%;
      text-align: center;
      font-size: 25px;
    }

    .settings {
      justify-content: center;
    }

    .wheel-container {
      margin: 12px auto;
    }

    .alphabet-table td {
      font-size: 16px;
    }
  }
</style>
</head>

<body>

<main class="studio">

  <header>
    <h1>Caesar-Studio</h1>

    <div class="settings">
      <button id="themeButton" aria-pressed="false">
        ◐ Schwarz-Weiß
      </button>

      <button id="soundButton" aria-pressed="true">
        🔊 Ton an
      </button>
    </div>
  </header>

  <div class="legend">
    <span class="plaintext">Klartext</span>
    <span class="ciphertext">Geheimtext</span>
  </div>

  <div class="wheel-container">

    <svg id="wheel"
         viewBox="0 0 440 440"
         xmlns="http://www.w3.org/2000/svg"
         aria-label="Interaktive Caesar-Scheibe">

      <!-- Feststehender Außenring -->
      <g id="outerRing"></g>

      <!-- Drehbarer Innenring -->
      <g id="innerRing"></g>

      <!-- Feststehende Schlüsselanzeige -->
      <circle class="center-circle"
              cx="220" cy="220" r="86"/>

      <text class="key-label"
            x="220" y="207">
        Schlüssel
      </text>

      <text class="key-number"
            id="keyDisplay"
            x="220" y="259">
        0
      </text>

    </svg>

  </div>

  <div class="controls">
    <button id="minusButton"
            aria-label="Schlüssel um eins verringern">
      ↶ −1
    </button>

    <button id="resetButton">
      Zurücksetzen
    </button>

    <button id="plusButton"
            aria-label="Schlüssel um eins erhöhen">
      +1 ↷
    </button>
  </div>

  <p class="hint">
    Drehe den inneren Ring mit der Maus oder dem Finger.
  </p>

  <div class="alphabet-wrapper">
    <table class="alphabet-table"
           aria-label="Zuordnung von Klartext und Geheimtext">
      <tbody>
        <tr id="plainRow" class="plaintext"></tr>
        <tr id="cipherRow" class="ciphertext"></tr>
      </tbody>
    </table>
  </div>

</main>

<script>

  // ==========================================
  // 1. Grundeinstellungen
  // ==========================================

  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const letterAngle = 360 / 26;

  const center = 220;

  let rotationSteps = 0;
  let key = 0;

  let soundEnabled = true;
  let audioContext = null;

  const wheel = document.getElementById("wheel");
  const outerRing = document.getElementById("outerRing");
  const innerRing = document.getElementById("innerRing");
  const keyDisplay = document.getElementById("keyDisplay");

  const plainRow = document.getElementById("plainRow");
  const cipherRow = document.getElementById("cipherRow");

  const svgNS = "http://www.w3.org/2000/svg";


  // ==========================================
  // 2. SVG-Elemente erzeugen
  // ==========================================

  function createSVG(tag, attributes) {

    const element = document.createElementNS(svgNS, tag);

    for (const name in attributes) {
      element.setAttribute(name, attributes[name]);
    }

    return element;
  }


  // ==========================================
  // 3. Alphabetscheiben zeichnen
  // ==========================================

  function createRing(group, outerRadius, innerRadius,
                      fillClass, letterClass, fontSize) {

    const circle = createSVG("circle", {
      cx: center,
      cy: center,
      r: outerRadius,
      class: fillClass
    });

    group.appendChild(circle);

    const letterRadius = (outerRadius + innerRadius) / 2;

    for (let i = 0; i < 26; i++) {

      const angle = i * letterAngle;

      const segment = createSVG("g", {
        transform: `rotate(${angle} ${center} ${center})`
      });

      const separator = createSVG("line", {
        x1: center,
        y1: center - outerRadius,
        x2: center,
        y2: center - innerRadius,
        class: "separator",
        transform:
          `rotate(${-letterAngle / 2} ${center} ${center})`
      });

      const letter = createSVG("text", {
        x: center,
        y: center - letterRadius,
        class: `letter ${letterClass}`,
        "font-size": fontSize
      });

      letter.textContent = alphabet[i];

      segment.appendChild(separator);
      segment.appendChild(letter);

      group.appendChild(segment);
    }
  }

  createRing(
    outerRing,
    210, 151,
    "outer-fill",
    "outer-letter",
    29
  );

  createRing(
    innerRing,
    148, 86,
    "inner-fill",
    "inner-letter",
    25
  );


  // ==========================================
  // 4. Substitutionstabelle
  // ==========================================

  for (let i = 0; i < 26; i++) {

    const plainCell = document.createElement("td");
    const cipherCell = document.createElement("td");

    plainCell.textContent = alphabet[i];
    cipherCell.textContent = alphabet[i];

    plainRow.appendChild(plainCell);
    cipherRow.appendChild(cipherCell);
  }

  function updateTable() {

    for (let i = 0; i < 26; i++) {

      cipherRow.children[i].textContent =
        alphabet[(i + key) % 26];
    }
  }


  // ==========================================
  // 5. Mechanischer Klicksound
  // ==========================================

  function prepareAudio() {

    if (!soundEnabled) return;

    try {

      if (!audioContext) {

        const AudioClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioClass) return;

        audioContext = new AudioClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }

    } catch (error) {
      // Die Scheibe funktioniert auch ohne Ton.
    }
  }

  function playClick() {

    if (!soundEnabled || !audioContext) return;

    if (audioContext.state !== "running") return;

    const duration = 0.028;
    const sampleRate = audioContext.sampleRate;

    const buffer = audioContext.createBuffer(
      1,
      Math.floor(sampleRate * duration),
      sampleRate
    );

    const data = buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {

      const decay = Math.exp(-i / (sampleRate * 0.004));

      data[i] = (Math.random() * 2 - 1) * decay;
    }

    const source = audioContext.createBufferSource();
    const filter = audioContext.createBiquadFilter();
    const volume = audioContext.createGain();

    source.buffer = buffer;

    filter.type = "bandpass";
    filter.frequency.value = 1600;
    filter.Q.value = 0.7;

    volume.gain.value = 0.13;

    source.connect(filter);
    filter.connect(volume);
    volume.connect(audioContext.destination);

    source.start();
  }


  // ==========================================
  // 6. Schlüssel und Drehung aktualisieren
  // ==========================================

  function setRotation(steps, withSound = true) {

    const previousSteps = rotationSteps;

    rotationSteps = steps;

    key = ((-rotationSteps % 26) + 26) % 26;

    const angle = rotationSteps * letterAngle;

    innerRing.setAttribute(
      "transform",
      `rotate(${angle} ${center} ${center})`
    );

    keyDisplay.textContent = key;

    updateTable();

    if (withSound && previousSteps !== rotationSteps) {
      playClick();
    }
  }


  // ==========================================
  // 7. Maus- und Touchsteuerung
  // ==========================================

  let activePointer = null;
  let previousAngle = 0;
  let accumulatedAngle = 0;
  let startSteps = 0;

  function getPointerAngle(event) {

    const matrix = wheel.getScreenCTM();

    if (!matrix) return null;

    const point = wheel.createSVGPoint();

    point.x = event.clientX;
    point.y = event.clientY;

    const position = point.matrixTransform(
      matrix.inverse()
    );

    const dx = position.x - center;
    const dy = position.y - center;

    // Nahe der Mitte ist der Drehwinkel unzuverlässig.
    if (Math.hypot(dx, dy) < 35) return null;

    return Math.atan2(dy, dx) * 180 / Math.PI;
  }

  innerRing.addEventListener("pointerdown", event => {

    if (activePointer !== null) return;

    if (event.pointerType === "mouse" &&
        event.button !== 0) return;

    const angle = getPointerAngle(event);

    if (angle === null) return;

    event.preventDefault();

    prepareAudio();

    activePointer = event.pointerId;
    previousAngle = angle;
    accumulatedAngle = 0;
    startSteps = rotationSteps;

    innerRing.setPointerCapture(event.pointerId);

    innerRing.classList.add("dragging");
  });

  innerRing.addEventListener("pointermove", event => {

    if (event.pointerId !== activePointer) return;

    const currentAngle = getPointerAngle(event);

    if (currentAngle === null) return;

    let difference = currentAngle - previousAngle;

    // Verhindert Sprünge beim Überschreiten
    // der Grenze zwischen 180 und -180 Grad.

    if (difference > 180) difference -= 360;
    if (difference < -180) difference += 360;

    accumulatedAngle += difference;

    previousAngle = currentAngle;

    // Einrasten auf den nächsten Buchstaben.

    const snappedSteps = Math.round(
      accumulatedAngle / letterAngle
    );

    setRotation(startSteps + snappedSteps);
  });

  function stopDragging(event) {

    if (event.pointerId !== activePointer) return;

    activePointer = null;

    innerRing.classList.remove("dragging");

    if (innerRing.hasPointerCapture(event.pointerId)) {
      innerRing.releasePointerCapture(event.pointerId);
    }
  }

  innerRing.addEventListener("pointerup", stopDragging);
  innerRing.addEventListener("pointercancel", stopDragging);
  innerRing.addEventListener("lostpointercapture", stopDragging);


  // ==========================================
  // 8. Drehbuttons
  // ==========================================

  document.getElementById("minusButton")
    .addEventListener("click", () => {

      prepareAudio();
      setRotation(rotationSteps + 1);
    });

  document.getElementById("plusButton")
    .addEventListener("click", () => {

      prepareAudio();
      setRotation(rotationSteps - 1);
    });

  document.getElementById("resetButton")
    .addEventListener("click", () => {

      prepareAudio();
      setRotation(0);
    });


  // ==========================================
  // 9. Farbmodus wechseln
  // ==========================================

  const themeButton =
    document.getElementById("themeButton");

  themeButton.addEventListener("click", () => {

    const monochrome =
      document.body.classList.toggle("monochrome");

    themeButton.textContent = monochrome
      ? "◐ Farbmodus"
      : "◐ Schwarz-Weiß";

    themeButton.setAttribute(
      "aria-pressed",
      String(monochrome)
    );
  });


  // ==========================================
  // 10. Ton ein- und ausschalten
  // ==========================================

  const soundButton =
    document.getElementById("soundButton");

  soundButton.addEventListener("click", () => {

    soundEnabled = !soundEnabled;

    soundButton.textContent = soundEnabled
      ? "🔊 Ton an"
      : "🔇 Ton aus";

    soundButton.setAttribute(
      "aria-pressed",
      String(soundEnabled)
    );

    if (soundEnabled) {
      prepareAudio();
    }
  });


  // ==========================================
  // 11. Startzustand
  // ==========================================

  setRotation(0, false);

</script>

</body>
</html>
